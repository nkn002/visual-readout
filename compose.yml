# Local dev with hot reload in both containers. `docker compose up`, then open http://localhost:5173
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATA_DIR: /data/sample
      DATABASE_URL: sqlite:////data/db/app.db
      CORS_ORIGINS: http://localhost:5173,https://nkn002.github.io
    volumes:
      - ./backend:/code
      - ./data:/data
    ports: ["8000:8000"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]
