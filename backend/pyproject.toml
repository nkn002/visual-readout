[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-readout-backend"
version = "0.1.0"
description = "FastAPI + SQLite backend for the visual-readout viewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "anthropic>=1.0",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# the HW2 classifier; install the CPU build: pip install torch --index-url https://download.pytorch.org/whl/cpu
model = ["torch>=2.4", "numpy>=1.26"]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
